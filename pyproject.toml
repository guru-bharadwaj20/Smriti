[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smriti-engine"
version = "0.1.0"
description = "Local code-anchored memory and context engine for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "guru-bharadwaj20", email = "gururb20@gmail.com"}]
dependencies = ["typer>=0.27,<1", "mcp>=2.2,<3", "pydantic>=2.12,<3", "tree-sitter>=0.26,<0.27", "tree-sitter-python>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-java>=0.23,<0.24", "pathspec>=1.1,<2", "watchdog>=6,<7", "tiktoken>=0.14,<1", "numpy>=2.5,<3"]

[project.optional-dependencies]
eval = ["pyarrow>=25,<26"]
vectors = ["onnxruntime>=1.30,<2", "tokenizers>=0.22,<1"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=9,<10", "hypothesis>=6,<7", "ruff>=0.16,<1", "mypy>=2.4,<3", "build>=1.6,<2", "jedi>=0.20,<1", "scipy>=1.18,<2"]

[project.scripts]
smriti = "smriti.server.cli:app"

[tool.setuptools.packages.find]
include = ["smriti*"]

[tool.setuptools.package-data]
smriti = ["py.typed", "ui/static/*", "vector/model_manifest.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["smriti/**/*.py", "tests/**/*.py", "bench/**/*.py", "scripts/task_commit.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: component integration checks", "oracle: comparison with independent reference", "benchmark: measured CPU performance"]
